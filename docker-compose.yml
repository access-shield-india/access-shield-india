# AccessShield India — local Docker Compose
#
# ---------------------------------------------------------------------------
# Persistent volumes (backup these in prod; local names below)
# ---------------------------------------------------------------------------
# | Compose volume key | Explicit name                 | Holds                         | Backup priority |
# |--------------------|--------------------------------|-------------------------------|-----------------|
# | postgres_data      | accessshield_postgres_data     | App DB `accessshield` + Keycloak DB `keycloak` | P0 |
# | redis_data         | accessshield_redis_data        | Cache / SSE pub-sub / jobs    | P2 (rebuildable) |
# | rabbitmq_data      | accessshield_rabbitmq_data     | Queue durable messages        | P1 |
# | minio_data         | accessshield_minio_data        | S3-compatible objects (dev)   | P0 |
#
# Ephemeral (no volume): tika, mailpit, keycloak container FS (Keycloak state is in Postgres).
# Realm bootstrap file is bind-mounted read-only from infra/keycloak/.
#
# Same Postgres instance, two databases:
#   accessshield  — application (Drizzle)
#   keycloak      — Keycloak only (never put app tables here)
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: accessshield-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: accessshield
    volumes:
      # P0 backup — contains BOTH accessshield + keycloak databases
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: accessshield-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      # P2 — AOF enabled; safe to rebuild from empty in most cases
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: accessshield-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: accessshield
      RABBITMQ_DEFAULT_PASS: accessshield
    volumes:
      # P1 — durable queues / definitions
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'check_port_connectivity']
      interval: 30s
      timeout: 10s
      retries: 5

  tika:
    image: apache/tika:2.9.2.1
    ports:
      - '9998:9998'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9998/tika']
      interval: 30s
      timeout: 10s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: accessshield-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'
      - '1025:1025'
    # No volume — captured email is local-dev only

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: accessshield-keycloak
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    ports:
      - '8080:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: 'true'
      # Same Postgres host as the app; dedicated database + role (not `accessshield`)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    volumes:
      - ./infra/keycloak/accessshield-realm.json:/opt/keycloak/data/import/accessshield-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/127.0.0.1/8080']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: accessshield-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      # P0 — object storage (screenshots, reports, documents)
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: accessshield-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done;
      mc mb --ignore-existing local/accessshield-data-dev;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: 'no'

  mobile-scanner:
    build:
      context: .
      dockerfile: apps/mobile-scanner/Dockerfile
    container_name: accessshield-mobile-scanner
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/accessshield}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://accessshield:accessshield@rabbitmq:5672}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-minioadmin}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-accessshield-data-dev}
      - S3_ENDPOINT=${S3_ENDPOINT:-http://minio:9000}
      - S3_FORCE_PATH_STYLE=${S3_FORCE_PATH_STYLE:-true}
      - CLOUDFRONT_URL=${CLOUDFRONT_URL}
      - BROWSERSTACK_USERNAME=${BROWSERSTACK_USERNAME}
      - BROWSERSTACK_ACCESS_KEY=${BROWSERSTACK_ACCESS_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started

# Explicit volume names so backup scripts can target them by name (not anonymous hashes).
volumes:
  postgres_data:
    name: accessshield_postgres_data
  redis_data:
    name: accessshield_redis_data
  rabbitmq_data:
    name: accessshield_rabbitmq_data
  minio_data:
    name: accessshield_minio_data
