name: Build and push GHCR images

on:
  workflow_dispatch:
  push:
    branches:
      - release-2026-09-R1
      - alpha

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image namespace and release tag
        id: vars
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/accessshield-web:${{ github.sha }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/accessshield-web:${{ steps.vars.outputs.release_tag }}
            ghcr.io/${{ steps.vars.outputs.owner_lc }}/accessshield-web:latest
          provenance: false
          sbom: false

  build-api:
